<div class="dashboard">
  <h1>Stock Market Dashboard</h1>

  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="searchSymbol"
      placeholder="Enter stock symbol (e.g., AAPL)"
      (keyup.enter)="onSearch()"
    />
    <button (click)="onSearch()">Search</button>
  </div>

  <div class="indicator-select">
    <label><input type="checkbox" [(ngModel)]="selectedIndicators" [value]="'SMA'" /> SMA</label>
    <label><input type="checkbox" [(ngModel)]="selectedIndicators" [value]="'EMA'" /> EMA</label>
    <label><input type="checkbox" [(ngModel)]="selectedIndicators" [value]="'RSI'" /> RSI</label>
    <label><input type="checkbox" [(ngModel)]="selectedIndicators" [value]="'MACD'" /> MACD</label>
    <label><input type="checkbox" [(ngModel)]="selectedIndicators" [value]="'BollingerBands'" /> Bollinger Bands</label>
  </div>

  <button (click)="initChart()">Apply Indicators</button>
  <button (click)="toggleFullScreen()">Full Screen</button>

  <p *ngIf="symbol">Daily time series for <strong>{{ symbol }}</strong></p>

  <div *ngIf="loading">Loading data...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="series && series.length">
    <canvas #chartCanvas></canvas>
  </div>

  <div *ngIf="series && !series.length && !loading && !error">
    No data available for symbol "{{ symbol }}".
  </div>
</div>
